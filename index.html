<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">-
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Wordly</title>
</head>
<body>

    <header>
          <h1>Wordly Language Comprehension</h1>
          <p>What are we searching Today ?</p>
    </header>
  
  <main>
    <section>
        <form id="search-form">
          <label for="word-input">Enter word:</label>
          <input id="word-input" placeholder="Enter word">
          <button type="submit">Search</button>
    </form>
    <div id="error-message"></div>
    <div id="results-section"></div>
    </section>

    <section id="results-section">
        
        
        <div id="word-placeholder">
            <h2 id="word-title"></h2>
            <p id="phonetic-text"></p>
        </div>

        <div id="audio-placeholder">
            <audio id="audio-player"></audio>
            <button id="play-audio-btn"></button>
        </div>

        <div id=definition-placeholder>
            <p id="definition-text"></p>
            <p id="part-of-speech"></p>
            <p id="synonyms-text"></p>
            <p id="example-text"></p>

        </div>
        <div id="error-message"></div>
    </section>
   
  </main>
    

    <script src="Index.js"></script>
</body>
</html>
